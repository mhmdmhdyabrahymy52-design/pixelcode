<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>

        تغییر رمز عبور | PixelCode

    </title>

    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@100;200;300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- CSS -->

    <link rel="stylesheet" href="../css/change-password.css">

    <link rel="stylesheet" href="../css/modal.css">

    <link rel="stylesheet" href="../css/toast.css">

    <link rel="stylesheet" href="../css/animations.css">

</head>

<body>

    <main class="change-password-page">

        <div class="change-password-card">

            <!--======================
                LOGO
        =======================-->

            <a href="index.html" class="logo">

                Pixel<span>Code</span>

            </a>

            <!--======================
                TITLE
        =======================-->

            <h1>

                تغییر رمز عبور

            </h1>

            <p class="subtitle">

                برای افزایش امنیت حساب کاربری،
                رمز عبور جدید خود را وارد کنید.

            </p>

            <!--======================
            USER INFORMATION
        =======================-->

            <div class="user-box">

                <img id="userAvatar" src="../images/avatar-default.svg" alt="Avatar">

                <div class="user-details">

                    <h3 id="userFullname">

                        ...

                    </h3>

                    <span id="userUsername">

                        ...

                    </span>

                </div>

            </div>

            <!--======================
            FORM START
        =======================-->

            <form id="changePasswordForm" class="change-password-form">

                <!--==========================
                رمز عبور فعلی
            ===========================-->

                <div class="input-group">

                    <label for="currentPassword">

                        رمز عبور فعلی

                    </label>

                    <div class="password-box">

                        <input type="password" id="currentPassword" placeholder="رمز عبور فعلی"
                            autocomplete="current-password">

                        <button type="button" class="show-password" id="toggleCurrentPassword">

                            👁

                        </button>

                    </div>

                </div>

                <!--==========================
                رمز عبور جدید
            ===========================-->

                <div class="input-group">

                    <label for="newPassword">

                        رمز عبور جدید

                    </label>

                    <div class="password-box">

                        <input type="password" id="newPassword" placeholder="حداقل ۸ کاراکتر"
                            autocomplete="new-password">

                        <button type="button" class="show-password" id="toggleNewPassword">

                            👁

                        </button>

                    </div>

                </div>

                <!--==========================
                تکرار رمز عبور
            ===========================-->

                <div class="input-group">

                    <label for="confirmPassword">

                        تکرار رمز عبور جدید

                    </label>

                    <div class="password-box">

                        <input type="password" id="confirmPassword" placeholder="تکرار رمز عبور"
                            autocomplete="new-password">

                        <button type="button" class="show-password" id="toggleConfirmPassword">

                            👁

                        </button>

                    </div>

                </div>

                <!--==========================
                    دکمه ذخیره
            ===========================-->

                <button type="submit" class="save-btn">

                    تغییر رمز عبور

                </button>

            </form>

            <!--==========================
                بازگشت
        ===========================-->

            <p class="back-text">

                <a href="./profile.html">

                    بازگشت به پروفایل

                </a>

            </p>

        </div>

    </main>

    <!--==========================
        MODAL
===========================-->

    <div id="modalOverlay" class="modal-overlay">

        <div class="modal">

            <div class="modal-icon">

                <span id="modalIcon">✔</span>

            </div>

            <h2 id="modalTitle">

                موفق

            </h2>

            <p id="modalMessage">

                عملیات انجام شد.

            </p>

            <button id="modalButton" class="modal-btn">

                باشه

            </button>

        </div>

    </div>

    <!--==========================
        TOAST
===========================-->

    <div id="toastContainer" class="toast-container">

    </div>

    <!--==========================
        JS
===========================-->

    <script src="../js/utils.js"></script>

    <script src="../js/modal.js"></script>

    <script src="../js/toast.js"></script>

    <script src="../js/change-password.js"></script>

</body>

</html>
